<title>2030 联合训练推演台</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* 布局：左侧参数仪表盘（桌面 340px 固定），右侧读数区；窄屏堆叠为单列 */
:root{
  --bg:#f4f6f7; --surface:#ffffff; --surface-2:#eceff1; --line:#d4dadd; --line-soft:#e3e8ea;
  --fg:#16212a; --fg-2:#54646f; --fg-3:#7d8c95;
  --accent:#0e7490; --accent-soft:#d7eef4; --accent-line:#8cc9d8;
  --good:#2f6f4f; --warn:#9a6a12; --crit:#a93b32;
  --good-bg:#e2f0e8; --warn-bg:#f7eeda; --crit-bg:#f8e4e2;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --sans:"IBM Plex Sans","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  --r:6px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#10171c; --surface:#17212a; --surface-2:#1d2a34; --line:#2d3f4b; --line-soft:#243440;
  --fg:#e6edf1; --fg-2:#9fb2bd; --fg-3:#73868f;
  --accent:#4fb3cc; --accent-soft:#143440; --accent-line:#2b6b80;
  --good:#6cbf92; --warn:#d8aa54; --crit:#e08079;
  --good-bg:#15291f; --warn-bg:#2b2416; --crit-bg:#2d1b1a;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#10171c; --surface:#17212a; --surface-2:#1d2a34; --line:#2d3f4b; --line-soft:#243440;
  --fg:#e6edf1; --fg-2:#9fb2bd; --fg-3:#73868f;
  --accent:#4fb3cc; --accent-soft:#143440; --accent-line:#2b6b80;
  --good:#6cbf92; --warn:#d8aa54; --crit:#e08079;
  --good-bg:#15291f; --warn-bg:#2b2416; --crit-bg:#2d1b1a;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);margin:0;
  font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);
  z-index:10;background:var(--surface)}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 40px;max-width:1240px;margin:0 auto}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--surface);
  border-bottom:1px solid var(--line);margin:0 calc(-1*max(16px,env(safe-area-inset-left,0px)));
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 10px}
h1{font-size:16px;font-weight:600;margin:0;letter-spacing:-.01em}
.sub{color:var(--fg-2);font-size:12px;margin-top:2px}
.presets{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.presets button{font:inherit;font-size:11.5px;padding:4px 10px;border-radius:999px;cursor:pointer;
  border:1px solid var(--line);background:var(--surface-2);color:var(--fg-2)}
.presets button:hover{border-color:var(--accent-line);color:var(--fg)}
.presets button[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent-line);color:var(--fg)}
.presets button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.cols{display:grid;grid-template-columns:340px minmax(0,1fr);gap:20px;margin-top:20px;align-items:start}
@media (max-width:820px){.cols{grid-template-columns:1fr}}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.panel>h2{font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;
  color:var(--fg-3);margin:0;padding:10px 14px 8px;border-bottom:1px solid var(--line-soft)}
.group{padding:4px 14px 12px}
.group+.group{border-top:1px solid var(--line-soft)}
.group-t{font-size:11px;font-weight:600;color:var(--accent);margin:10px 0 2px;letter-spacing:.04em}
.ctrl{display:grid;grid-template-columns:1fr auto;align-items:baseline;gap:4px 8px;margin-top:9px}
.ctrl label{font-size:12.5px;color:var(--fg-2);min-width:0}
.ctrl .val{font-family:var(--mono);font-size:12.5px;font-weight:500;font-variant-numeric:tabular-nums}
.ctrl input[type=range]{grid-column:1/-1;width:100%;accent-color:var(--accent);margin:2px 0 0}
.seg{display:grid;grid-template-columns:1fr;gap:4px;margin-top:8px}
.seg button{font:inherit;font-size:12px;text-align:left;padding:7px 10px;border-radius:var(--r);
  cursor:pointer;border:1px solid var(--line);background:var(--surface-2);color:var(--fg-2)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent-line);color:var(--fg);font-weight:500}
.seg small{display:block;color:var(--fg-3);font-size:10.5px;margin-top:1px;font-weight:400}

.readouts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.tile .k{font-size:11px;color:var(--fg-3);letter-spacing:.04em}
.tile .v{font-family:var(--mono);font-size:30px;font-weight:600;line-height:1.1;margin-top:4px;
  font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.tile .u{font-size:13px;color:var(--fg-2);font-weight:400;margin-left:3px}
.tile .n{font-size:11px;color:var(--fg-3);margin-top:4px}
.tile.hero{border-color:var(--accent-line);background:var(--accent-soft)}
.pill{display:inline-block;font-size:10.5px;padding:1px 7px;border-radius:999px;font-weight:500;
  border:1px solid transparent;vertical-align:1px}
.pill.ok{background:var(--good-bg);color:var(--good)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--crit-bg);color:var(--crit)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-top:12px}
.card>h3{font-size:12.5px;font-weight:600;margin:0 0 2px}
.card>.hint{font-size:11.5px;color:var(--fg-3);margin:0 0 10px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px;margin-top:12px}
svg{display:block;width:100%;height:auto;overflow:visible}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th,td{text-align:left;padding:5px 8px 5px 0;border-bottom:1px solid var(--line-soft)}
th{font-size:11px;color:var(--fg-3);font-weight:500;letter-spacing:.03em}
td.num,th.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;padding-right:0}
tr:last-child td{border-bottom:none}
.foot{margin-top:16px;font-size:11.5px;color:var(--fg-3);line-height:1.6}
.foot code{font-family:var(--mono);font-size:11px;background:var(--surface-2);padding:1px 4px;border-radius:3px}
.bar-row{display:grid;grid-template-columns:132px minmax(0,1fr) 72px;gap:8px;align-items:center;margin-top:7px;font-size:12px}
.bar-row .nm{color:var(--fg-2);min-width:0}
.bar-track{height:14px;background:var(--surface-2);border-radius:3px;position:relative;overflow:hidden}
.bar-fill{height:100%;border-radius:3px}
.bar-row .q{font-family:var(--mono);font-size:11.5px;text-align:right;font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:no-preference){.bar-fill{transition:width .18s ease}}
</style>

<div class="wrap">
<header>
  <h1>2030 联合训练推演台</h1>
  <div class="sub">拖动参数，看一次前沿训练需要几个数据中心、跨站带宽够不够、MFU 卡在哪一环</div>
  <div class="presets" id="presets"></div>
</header>

<div class="cols">
  <div class="panel" id="panel">
    <h2>参数</h2>
    <div class="group">
      <div class="group-t">需求侧</div>
      <div id="g-demand"></div>
    </div>
    <div class="group">
      <div class="group-t">加速器与系统</div>
      <div id="g-accel"></div>
    </div>
    <div class="group">
      <div class="group-t">站点与站间链路</div>
      <div id="g-site"></div>
    </div>
    <div class="group">
      <div class="group-t">跨站同步策略</div>
      <div class="seg" id="g-strat"></div>
    </div>
  </div>

  <div>
    <div class="readouts" id="tiles"></div>

    <div class="card">
      <h3>跨站带宽：各同步策略的需求 vs 可得</h3>
      <p class="hint">横轴对数刻度。竖线是当前设定的站点对可用带宽，条形越过竖线即不可行。</p>
      <div id="bw"></div>
    </div>

    <div class="grid2">
      <div class="card" style="margin-top:0">
        <h3>一个 step 的时间去哪了</h3>
        <p class="hint">per-die 口径，单位毫秒</p>
        <div id="split"></div>
      </div>
      <div class="card" style="margin-top:0">
        <h3>故障率与 goodput</h3>
        <p class="hint">按 Llama 3 实测标定单卡 MTBI 5.8 年，线性外推</p>
        <div id="good"></div>
      </div>
    </div>

    <div class="card">
      <h3>站点数是被什么卡住的</h3>
      <div id="constraint"></div>
    </div>

    <div class="foot" id="foot"></div>
  </div>
</div>
</div>

<script>
"use strict";
/* ---------- 固定结构假设（与报告建模代码一致） ---------- */
const FIX = { L:160, h:24576, seq:32768, topk:8, kv:0.125, tp:8, cp:2, pp:16,
              scaleupTBs:4.0, facFrac:0.44, fabricLimit:2e5, anchor:1e27, years:3.7,
              mtbfYears:5.8 };

const STRATS = [
  {id:'sync',   name:'同步数据并行',            H:1,   bits:16, frag:1,  beta:0.05, elastic:false, q:1.0,    note:'前沿规模标准做法'},
  {id:'hier',   name:'分层 AllReduce',          H:1,   bits:16, frag:1,  beta:0.05, elastic:false, q:1.0,    note:'数学等价，NeMo 双站实测 >96%'},
  {id:'dl30',   name:'DiLoCo H=30',             H:30,  bits:16, frag:1,  beta:0.05, elastic:true,  q:0.95,   note:'2.4B 处 M=2 已反超 DP'},
  {id:'stream', name:'Streaming DiLoCo + 4bit', H:100, bits:4,  frag:8,  beta:0.05, elastic:true,  q:0.9,    note:'量化 loss gap <0.12%'},
  {id:'eager',  name:'Eager DiLoCo 完全重叠',   H:100, bits:4,  frag:8,  beta:1.0,  elastic:true,  q:0.9,    note:'1B/250B token：2.46 vs DP 2.45'},
  {id:'decoup', name:'Decoupled DiLoCo (K=1)',  H:24,  bits:4,  frag:24, beta:1.0,  elastic:true,  q:0.875,  note:'120 万芯片仿真 goodput 88%'}
];

const SLIDERS = [
  {g:'demand', k:'growth',   label:'训练算力增速',   min:3,    max:5,    step:0.1,  fmt:v=>v.toFixed(1)+'×/年'},
  {g:'demand', k:'days',     label:'训练时长',       min:60,   max:180,  step:5,    fmt:v=>v+' 天'},
  {g:'demand', k:'params',   label:'总参数量',       min:10,   max:200,  step:2,    fmt:v=>v+' T'},
  {g:'demand', k:'sparsity', label:'MoE 稀疏比',     min:6,    max:40,   step:1,    fmt:v=>v+'×'},
  {g:'demand', k:'batch',    label:'全局批量',       min:20,   max:2000, step:10,   fmt:v=>v>=1000?(v/1000).toFixed(1)+'B token':v+'M token'},
  {g:'accel',  k:'dieFlops', label:'单 die 稠密 FP8', min:3,   max:40,   step:1,    fmt:v=>v+' PFLOPS'},
  {g:'accel',  k:'diePower', label:'单 die 功耗',    min:500,  max:2500, step:50,   fmt:v=>v+' W'},
  {g:'accel',  k:'domain',   label:'scale-up 域',    min:0,    max:5,    step:1,    fmt:v=>DOMAINS[v]+' 卡', raw:true},
  {g:'accel',  k:'scaleout', label:'scale-out 单 die',min:100, max:3200, step:100,  fmt:v=>v>=1000?(v/1000).toFixed(1)+' Tb/s':v+' Gb/s'},
  {g:'site',   k:'psite',    label:'单站功率上限',   min:0.2,  max:5,    step:0.1,  fmt:v=>v.toFixed(1)+' GW'},
  {g:'site',   k:'dist',     label:'相邻站点距离',   min:200,  max:3000, step:100,  fmt:v=>v+' km'},
  {g:'site',   k:'link',     label:'站点对可用带宽', min:0.02, max:10,   step:0.02, fmt:v=>v.toFixed(2)+' Pbps'}
];
const DOMAINS = [512,1024,2048,4096,8192,16384];

const PRESETS = {
  '中国中性': {growth:4,days:100,params:72,sparsity:18,batch:200,dieFlops:18,diePower:1500,domain:3,scaleout:400,psite:1,dist:1200,link:0.6,strat:'stream'},
  '中国·制程受限':{growth:4,days:100,params:72,sparsity:18,batch:200,dieFlops:8,diePower:1500,domain:0,scaleout:400,psite:0.5,dist:1500,link:0.3,strat:'stream'},
  '美国中性': {growth:4,days:100,params:72,sparsity:18,batch:200,dieFlops:30,diePower:1100,domain:0,scaleout:800,psite:2,dist:1000,link:3,strat:'stream'},
  '美国·大域对照':{growth:4,days:100,params:72,sparsity:18,batch:200,dieFlops:30,diePower:1100,domain:3,scaleout:800,psite:2,dist:1000,link:3,strat:'stream'},
  'Epoch 10GW 复现':{growth:3.6,days:100,params:72,sparsity:18,batch:1100,dieFlops:2.5,diePower:600,domain:0,scaleout:400,psite:0.44,dist:210,link:6,strat:'sync'},
  '激进 5×/年':{growth:5,days:100,params:150,sparsity:19,batch:400,dieFlops:18,diePower:1500,domain:3,scaleout:800,psite:2,dist:1500,link:1.2,strat:'decoup'}
};

let S = Object.assign({}, PRESETS['中国中性']);
let activePreset = '中国中性';

/* ---------- 模型 ---------- */
function strat(){ return STRATS.find(s=>s.id===S.strat) || STRATS[3]; }

function simulate(nDies, peak, eta){
  const dom = DOMAINS[S.domain];
  const {tp,cp,pp,L,h,seq,topk,kv} = FIX;
  const ep = Math.max(1, Math.min(1024, Math.floor(dom/(tp*cp))));
  const dpr = tp*cp*pp*ep;
  const nRep = Math.max(nDies/dpr, 1);
  const totalP = S.params*1e12;
  const nActive = totalP/S.sparsity;
  const fpt = 6*nActive + 12*L*h*seq;
  const tokRep = (S.batch*1e6)/nRep;
  const m = Math.max(tokRep/seq, 1);
  const tokDie = seq/(ep*cp);
  const Ls = L/pp;
  const suBps = FIX.scaleupTBs*1e12*8;
  const soBps = S.scaleout*1e9;

  const P = peak/eta;
  const nSitesPower = Math.max(1, Math.ceil(P/(S.psite*1e9)));
  const nSitesFabric = Math.max(1, Math.ceil(nDies/FIX.fabricLimit));
  const nSites = Math.max(nSitesPower, nSitesFabric);
  const dpIntra = Math.max(nRep/nSites, 1);

  const tCompute = (tokRep*fpt/dpr)/(S.dieFlops*1e15);
  const tTP = (8*Ls*tokDie*h*(tp-1)/tp*2)*8/suBps*m;
  const tCP = cp>1 ? (4*Ls*tokDie*h*kv*(cp-1)/cp*2)*8/suBps*m : 0;
  const intra = (ep*tp) <= dom;
  const tEP = ep>1 ? (4*Ls*tokDie*topk*h*(ep-1)/ep*2)*8/(intra?suBps:soBps)*m : 0;
  const expEP = intra?0.15:0.55;
  const tPP = (2*tokDie*h*2)*8/soBps*m;
  const bubble = tCompute*((pp-1)/(m+pp-1))*0.5;
  const pDie = totalP/(tp*pp*ep);
  const tDPi = dpIntra>1 ? (2*pDie*(dpIntra-1)/dpIntra*2)*8/soBps : 0;

  const st = strat();
  const payload = totalP*st.bits/st.frag;
  const tSer = nSites>1 ? payload/(S.link*1e15) : 0;
  const tProp = nSites>1 ? S.dist*5e-6*nSites : 0;
  const tDPx = nSites>1 ? (tSer+tProp)/st.H : 0;

  const expComm = tTP + tCP + expEP*tEP + 0.2*tPP;
  const dpExp = Math.max(0, tDPi + tDPx - tCompute);
  const tStep = tCompute + expComm + dpExp + bubble;
  const mfu = tStep>0 ? tCompute/tStep : 0;

  const parts = {'计算':tCompute,'TP':tTP,'CP':tCP,'EP':expEP*tEP,'PP':0.2*tPP,'DP':dpExp,'流水气泡':bubble};
  let bound='计算', bv=-1;
  for (const k in parts) if (parts[k]>bv){bv=parts[k];bound=k;}

  return {ep,dpr,nRep,m,tokDie,tCompute,tTP,tCP,tEP:expEP*tEP,tPP:0.2*tPP,tDPi,tDPx,bubble,
          tStep,mfu,parts,bound,nSites,nSitesPower,nSitesFabric,dpIntra,pDie,intra,P,payload,tProp};
}

function solve(){
  const C = FIX.anchor*Math.pow(S.growth, FIX.years);
  const T = S.days*86400;
  const eta = (S.dieFlops*1e15/S.diePower)*FIX.facFrac;
  let mfu = 0.40, converged=false, sim=null, peak=0, nDies=0;
  for (let i=0;i<60;i++){
    peak = C/(T*mfu);
    nDies = peak/(S.dieFlops*1e15);
    sim = simulate(nDies, peak, eta);
    const next = Math.max(0.01, Math.min(0.95, sim.mfu));
    if (Math.abs(next-mfu) < 0.0015){ mfu = next; converged = true; break; }
    mfu = 0.6*mfu + 0.4*next;
  }
  peak = C/(T*mfu); nDies = peak/(S.dieFlops*1e15);
  sim = simulate(nDies, peak, eta);
  return {C,T,eta,mfu,converged,sim,peak,nDies};
}

function bwNeed(st, nSites, tStep){
  const payload = S.params*1e12*st.bits/st.frag;
  const budget = tStep*st.H*Math.min(st.beta,1);
  const usable = budget - S.dist*5e-6*nSites;
  return usable>0 ? payload/usable : Infinity;
}

function goodput(nDies, elastic, q, recov, ckpt){
  const rate = nDies/(FIX.mtbfYears*365.25*86400);
  if (!elastic) return 1/(1+rate*(recov+ckpt/2));
  const frac = Math.max(1-q, 1/Math.max(nDies,1));
  return 1/(1+rate*recov*frac);
}

/* ---------- 格式化 ---------- */
const nf = (v,d=1)=> v.toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
function sci(v){ if(!isFinite(v)) return '∞'; const e=Math.floor(Math.log10(v)); return (v/Math.pow(10,e)).toFixed(1)+'e'+e; }
function pbps(v){ if(!isFinite(v)) return '∞';
  const p=v/1e15; if(p>=0.01) return p.toFixed(2)+' Pbps';
  const t=v/1e12; if(t>=1) return t.toFixed(0)+' Tbps';
  return (v/1e9).toFixed(1)+' Gbps'; }

/* ---------- 渲染 ---------- */
function buildControls(){
  for (const g of ['demand','accel','site']){
    const host = document.getElementById('g-'+g);
    host.innerHTML='';
    SLIDERS.filter(s=>s.g===g).forEach(s=>{
      const d=document.createElement('div'); d.className='ctrl';
      d.innerHTML = '<label for="s-'+s.k+'">'+s.label+'</label><span class="val" id="v-'+s.k+'"></span>'+
        '<input type="range" id="s-'+s.k+'" min="'+s.min+'" max="'+s.max+'" step="'+s.step+'">';
      host.appendChild(d);
      const inp=d.querySelector('input');
      inp.value=S[s.k];
      inp.addEventListener('input',()=>{ S[s.k]=parseFloat(inp.value); activePreset=null; render(); });
    });
  }
  const sh=document.getElementById('g-strat'); sh.innerHTML='';
  STRATS.forEach(st=>{
    const b=document.createElement('button'); b.type='button';
    b.innerHTML = st.name + '<small>' + st.note + '</small>';
    b.addEventListener('click',()=>{ S.strat=st.id; activePreset=null; render(); });
    b.dataset.sid=st.id; sh.appendChild(b);
  });
  const ph=document.getElementById('presets'); ph.innerHTML='';
  Object.keys(PRESETS).forEach(name=>{
    const b=document.createElement('button'); b.type='button'; b.textContent=name;
    b.addEventListener('click',()=>{ S=Object.assign({},PRESETS[name]); activePreset=name; syncInputs(); render(); });
    b.dataset.pname=name; ph.appendChild(b);
  });
}
function syncInputs(){ SLIDERS.forEach(s=>{ const i=document.getElementById('s-'+s.k); if(i) i.value=S[s.k]; }); }

function render(){
  SLIDERS.forEach(s=>{ const el=document.getElementById('v-'+s.k); if(el) el.textContent=s.fmt(S[s.k]); });
  document.querySelectorAll('#g-strat button').forEach(b=>b.setAttribute('aria-pressed', String(b.dataset.sid===S.strat)));
  document.querySelectorAll('#presets button').forEach(b=>b.setAttribute('aria-pressed', String(b.dataset.pname===activePreset)));

  const r = solve(), sim = r.sim, st = strat();
  const need = bwNeed(st, sim.nSites, sim.tStep);
  const avail = S.link*1e15;
  const feas = need <= avail;

  /* 读数 */
  const gp = goodput(r.nDies, st.elastic, st.q, st.elastic?60:420, st.elastic?10:1800);
  document.getElementById('tiles').innerHTML = [
    tile('需要的数据中心数', sim.nSites, '', '电力口径 '+sim.nSitesPower+' · 网络域口径 '+sim.nSitesFabric, true),
    tile('设施总功率', nf(sim.P/1e9,2), 'GW', '单站 '+Math.round(sim.P/sim.nSites/1e6)+' MW'),
    tile('加速器 die 数', nf(r.nDies/1e4,0), '万', '单站 '+nf(r.nDies/sim.nSites/1e4,1)+' 万'),
    tile('可达 MFU', nf(r.mfu,3), '', (r.converged?'瓶颈：'+sim.bound:'未收敛，配置不自洽')),
    tile('跨站可行性', feas?'可行':'不可行', '', '需 '+pbps(need)+' · 有 '+pbps(avail)),
    tile('百万卡 goodput', nf(gp,3), '', st.elastic?'quorum 弹性':'全局 barrier')
  ].join('');

  drawBW(sim, avail);
  drawSplit(sim);
  drawGood(r.nDies);
  drawConstraint(r, sim);

  document.getElementById('foot').innerHTML =
    '一次训练 <code>'+sci(r.C)+' FLOP</code>（2026 年锚点 1e27 FLOP 按 '+S.growth.toFixed(1)+'×/年 外推 3.7 年）· '+
    '固定结构：'+FIX.L+' 层 · hidden '+FIX.h+' · 序列 '+FIX.seq+' · TP '+FIX.tp+' / CP '+FIX.cp+' / PP '+FIX.pp+
    '，EP 由 scale-up 域自动取到 '+sim.ep+' · scale-up 单 die '+FIX.scaleupTBs+' TB/s · 设施占比 '+FIX.facFrac+
    ' · 单 fabric 上限 '+(FIX.fabricLimit/1e4)+' 万 die。<br>'+
    '单副本 '+sim.dpr.toLocaleString('en-US')+' die，共 '+nf(sim.nRep,0)+' 个副本，每副本每 step '+nf(sim.m,0)+
    ' 个微批；单 die 承担 '+nf(sim.pDie/1e9,1)+' B 参数（约 '+nf(sim.pDie*14/1e9,0)+
    ' GB 参数+优化器状态）。EP '+(sim.intra?'在 scale-up 域内':'已跨出 scale-up 域 — 通信代价陡增')+'。';
}

function tile(k,v,u,n,hero){
  return '<div class="tile'+(hero?' hero':'')+'"><div class="k">'+k+'</div>'+
    '<div class="v">'+v+(u?'<span class="u">'+u+'</span>':'')+'</div>'+
    '<div class="n">'+n+'</div></div>';
}

function drawBW(sim, avail){
  const rows = STRATS.map(s=>({s, need:bwNeed(s, sim.nSites, sim.tStep)}));
  const finite = rows.map(r=>r.need).filter(v=>isFinite(v));
  const hi = Math.max(avail*4, ...finite, 1e13);
  const lo = Math.min(avail/8, ...finite.filter(v=>v>0), 1e11);
  const pos = v => Math.max(0, Math.min(1, (Math.log10(v)-Math.log10(lo))/(Math.log10(hi)-Math.log10(lo))));
  const markPct = (pos(avail)*100).toFixed(2);
  let html = '';
  rows.forEach(r=>{
    const inf = !isFinite(r.need);
    const ok = r.need <= avail;
    const w = inf ? 100 : pos(r.need)*100;
    const col = inf||!ok ? 'var(--crit)' : 'var(--accent)';
    html += '<div class="bar-row"><div class="nm">'+r.s.name+(r.s.id===S.strat?' ●':'')+'</div>'+
      '<div class="bar-track"><div class="bar-fill" style="width:'+w.toFixed(1)+'%;background:'+col+
      (inf?';opacity:.55':'')+'"></div>'+
      '<div style="position:absolute;left:'+markPct+'%;top:0;bottom:0;width:2px;background:var(--fg-2)"></div></div>'+
      '<div class="q" style="color:'+(inf||!ok?'var(--crit)':'var(--fg-2)')+'">'+pbps(r.need)+'</div></div>';
  });
  html += '<div style="font-size:11px;color:var(--fg-3);margin-top:9px">竖线 = 站点对可用带宽 '+pbps(avail)+
    ' · 传播时延已占同步预算 '+nf(sim.tProp*1000,1)+' ms（'+sim.nSites+' 跳 × '+S.dist+' km）</div>';
  document.getElementById('bw').innerHTML = html;
}

function drawSplit(sim){
  const order = ['计算','TP','CP','EP','PP','DP','流水气泡'];
  const cols = {'计算':'var(--accent)','TP':'var(--fg-2)','CP':'var(--fg-3)','EP':'var(--warn)',
                'PP':'var(--fg-3)','DP':'var(--crit)','流水气泡':'var(--line)'};
  const tot = sim.tStep || 1;
  let seg='', rows='';
  let x=0;
  order.forEach(k=>{
    const v=sim.parts[k]||0; if(v<=0) return;
    const w=v/tot*100;
    seg += '<div style="width:'+w.toFixed(2)+'%;background:'+cols[k]+'" title="'+k+' '+nf(v*1000,2)+' ms"></div>';
    rows += '<tr><td><span style="display:inline-block;width:9px;height:9px;border-radius:2px;background:'+cols[k]+
      ';margin-right:6px"></span>'+k+'</td><td class="num">'+nf(v*1000,2)+'</td><td class="num">'+nf(v/tot*100,1)+'%</td></tr>';
    x+=w;
  });
  document.getElementById('split').innerHTML =
    '<div style="display:flex;height:18px;border-radius:3px;overflow:hidden;gap:1px;background:var(--line-soft)">'+seg+'</div>'+
    '<table style="margin-top:10px"><tr><th>环节</th><th class="num">毫秒</th><th class="num">占比</th></tr>'+rows+
    '<tr><td style="font-weight:600">step 合计</td><td class="num" style="font-weight:600">'+nf(sim.tStep*1000,2)+
    '</td><td class="num" style="font-weight:600">100%</td></tr></table>';
}

function drawGood(nDiesNow){
  const xs=[1.6e4,1e5,5e5,1e6,2e6,4e6];
  const series=[
    {n:'同步 DP · 30 min 检查点', e:false,q:1,   rec:600,ck:1800, c:'var(--crit)'},
    {n:'同步 DP · 内存内检查点',  e:false,q:1,   rec:420,ck:10,   c:'var(--warn)'},
    {n:'弹性 DP (M=1)',          e:true, q:0.95,rec:420,ck:10,   c:'var(--fg-2)'},
    {n:'Decoupled DiLoCo (M=8)', e:true, q:0.875,rec:60,ck:10,   c:'var(--accent)'}
  ];
  const W=380,H=170,ml=34,mr=8,mt=10,mb=28;
  const X=v=>ml+(Math.log10(v)-Math.log10(1.6e4))/(Math.log10(4e6)-Math.log10(1.6e4))*(W-ml-mr);
  const Y=v=>mt+(1-v)*(H-mt-mb);
  let s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="goodput 随芯片数下降">';
  [0,0.5,1].forEach(v=>{ s+='<line x1="'+ml+'" x2="'+(W-mr)+'" y1="'+Y(v)+'" y2="'+Y(v)+'" stroke="var(--line-soft)"/>'+
    '<text x="'+(ml-6)+'" y="'+(Y(v)+3.5)+'" text-anchor="end" font-size="9" fill="var(--fg-3)">'+v.toFixed(1)+'</text>'; });
  [1.6e4,1e5,1e6,4e6].forEach(v=>{ s+='<text x="'+X(v)+'" y="'+(H-10)+'" text-anchor="middle" font-size="9" fill="var(--fg-3)">'+
    (v>=1e6?(v/1e6)+'M':(v/1e3)+'K')+'</text>'; });
  series.forEach(se=>{
    const d=xs.map((v,i)=>(i?'L':'M')+X(v).toFixed(1)+' '+Y(goodput(v,se.e,se.q,se.rec,se.ck)).toFixed(1)).join(' ');
    s+='<path d="'+d+'" fill="none" stroke="'+se.c+'" stroke-width="1.8"/>';
  });
  const nx=Math.max(1.6e4,Math.min(4e6,nDiesNow));
  s+='<line x1="'+X(nx)+'" x2="'+X(nx)+'" y1="'+mt+'" y2="'+Y(0)+'" stroke="var(--fg)" stroke-width="1" stroke-dasharray="3 3"/>';
  s+='<text x="'+X(nx)+'" y="'+(mt-1)+'" text-anchor="middle" font-size="9" fill="var(--fg)">当前 '+nf(nDiesNow/1e4,0)+' 万</text>';
  s+='</svg>';
  s+='<div style="margin-top:8px;font-size:11px;line-height:1.7">'+series.map(se=>
    '<span style="display:inline-block;margin-right:12px;white-space:nowrap"><span style="display:inline-block;width:10px;height:2px;background:'+
    se.c+';vertical-align:3px;margin-right:4px"></span>'+se.n+'</span>').join('')+'</div>';
  document.getElementById('good').innerHTML=s;
}

function drawConstraint(r, sim){
  const win = sim.nSitesFabric > sim.nSitesPower ? 'fabric' : (sim.nSitesPower>sim.nSitesFabric ? 'power' : 'tie');
  const row=(nm,val,note,on)=>'<tr'+(on?' style="font-weight:600"':'')+'><td>'+nm+(on?' <span class="pill ok">生效</span>':'')+
    '</td><td class="num">'+val+'</td><td style="color:var(--fg-3);font-size:11.5px;text-align:right">'+note+'</td></tr>';
  document.getElementById('constraint').innerHTML =
    '<table><tr><th>口径</th><th class="num">站点数</th><th style="text-align:right">算法</th></tr>'+
    row('电力', sim.nSitesPower, '⌈'+nf(sim.P/1e9,2)+' GW ÷ '+S.psite.toFixed(1)+' GW⌉', win!=='fabric')+
    row('单站网络域', sim.nSitesFabric, '⌈'+nf(r.nDies/1e4,0)+' 万 die ÷ 20 万⌉', win!=='power')+
    '</table>'+
    '<p style="margin:10px 0 0;font-size:11.5px;color:var(--fg-2)">'+
    (win==='fabric'
      ? '网络域是约束：把园区做得更大并不能减少站点数，除非单个无阻塞 fabric 也能跟着做大。'
      : '电力是约束：扩大单站功率上限可以直接减少站点数，直到撞上 '+sim.nSitesFabric+' 个站的网络域下限。')+
    '</p>';
}

buildControls();
syncInputs();
render();
</script>
